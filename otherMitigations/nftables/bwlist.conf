#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    
    set blacklist {
        type ipv4_addr
        flags interval
    }
    
    set whitelist {
        type ipv4_addr
        flags interval
    }
    
    chain input {
        type filter hook input priority filter; policy accept;
        
        iif enp0s3 accept
        iif lo accept
        
        ip saddr @blacklist drop
        
        ip saddr @whitelist accept
        
        meter ratelimit { ip saddr limit rate over 10/second burst 5 packets } drop
        
        accept
    }
    
    chain forward {
        type filter hook forward priority filter; policy accept;
    }
    
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
